services:
  - type: web
    name: construction-crm-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health

  - type: web
    name: construction-crm-frontend
    runtime: python
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend.py --server.address 0.0.0.0 --server.port $PORT
